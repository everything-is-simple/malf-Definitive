<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 495" role="img" font-family="var(--font-sans)" width="100%">
<title>HH(n) 与 HL(m) 的时间关系：HH(n) 的守护是 HL(m-1)，HL(m) 是下一个待定低点</title>
<rect width="680" height="495" fill="#FFFFFF"/>
<text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2329">HH(n) 生成时，HL(m) 还不存在：守护是 HL(m-1)</text>

<!-- ============ 上：守住，HL(m) 成立 ============ -->
<text x="40" y="58" font-size="13" font-weight="bold" fill="#1F2329">上：回落守住，右侧两根确认 → HL(m) 成立，守护上移</text>
<polyline points="70,225 110,175 150,135 190,105 230,145 270,165 310,155 350,145 390,105"
          fill="none" stroke="#1F2329" stroke-width="2.5"/>
<polyline points="55,231 300,231" fill="none" stroke="#1E6FD9" stroke-width="2" stroke-dasharray="6,4"/>
<polyline points="300,231 355,231 355,171 400,171" fill="none" stroke="#1E6FD9" stroke-width="2" stroke-dasharray="6,4"/>
<text x="60" y="251" font-size="12" fill="#1E6FD9">守护 = HL(m-1)</text>
<text x="360" y="191" font-size="12" fill="#1E6FD9">守护上移到 HL(m)</text>
<circle cx="70" cy="225" r="4.5" fill="#1E6FD9"/>
<text x="70" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E6FD9">HL(m-1)</text>
<circle cx="190" cy="105" r="4.5" fill="#C0392B"/>
<text x="185" y="91" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">HH(n)</text>
<text x="290" y="88" text-anchor="middle" font-size="11.5" fill="#C0392B">此刻守护还是 HL(m-1)</text>
<circle cx="270" cy="165" r="4.5" fill="#1E6FD9"/>
<text x="262" y="187" text-anchor="middle" font-size="12" fill="#1E6FD9">候选低点</text>
<text x="330" y="131" text-anchor="middle" font-size="11.5" fill="#4E5969">右 1　右 2</text>
<text x="300" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E6FD9">确认 → HL(m)</text>
<circle cx="390" cy="105" r="4.5" fill="none" stroke="#C0392B" stroke-width="2"/>
<text x="395" y="91" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">HH(n+1)</text>

<line x1="40" y1="292" x2="640" y2="292" stroke="#E5E6EB"/>

<!-- ============ 下：跌穿，波段死 ============ -->
<text x="40" y="317" font-size="13" font-weight="bold" fill="#1F2329">下：回落跌穿 HL(m-1) → 波段死，这个低点不是 HL(m)</text>
<polyline points="70,405 110,365 150,345 190,330 230,370 270,410 310,450 350,460"
          fill="none" stroke="#1F2329" stroke-width="2.5"/>
<polyline points="55,411 400,411" fill="none" stroke="#1E6FD9" stroke-width="2" stroke-dasharray="6,4"/>
<text x="405" y="415" font-size="12" fill="#1E6FD9">守护 = HL(m-1)，不动</text>
<circle cx="70" cy="405" r="4.5" fill="#1E6FD9"/>
<text x="70" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E6FD9">HL(m-1)</text>
<circle cx="190" cy="330" r="4.5" fill="#C0392B"/>
<text x="190" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#C0392B">HH(n)</text>
<text x="290" y="423" font-size="20" font-weight="bold" fill="#C0392B">✕</text>
<text x="330" y="435" font-size="12.5" font-weight="bold" fill="#C0392B">击穿：小波段结束</text>
<text x="330" y="455" font-size="12" fill="#4E5969">这个低点只是击穿点，不进 HL 序列</text>
</svg>
