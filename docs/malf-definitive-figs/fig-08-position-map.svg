<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
<rect x="0" y="0" width="820" height="500" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="820" height="500" rx="10" fill="none" stroke="#d9dee5" stroke-width="1"/>
<text x="28" y="40" font-size="18" fill="#1f2933" text-anchor="start" font-weight="bold">图 波段位置怎么读：两个分位只是一个坐标</text>
<text x="28" y="64" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">示意图，非真实行情。横轴推进分位，纵轴停滞分位。四个角都不对应买卖。</text>
<rect x="130" y="110" width="600" height="280" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<line x1="280.0" y1="110" x2="280.0" y2="390" stroke="#e5e7eb" stroke-width="1"/>
<line x1="130" y1="180.0" x2="730" y2="180.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="430.0" y1="110" x2="430.0" y2="390" stroke="#e5e7eb" stroke-width="1"/>
<line x1="130" y1="250.0" x2="730" y2="250.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="580.0" y1="110" x2="580.0" y2="390" stroke="#e5e7eb" stroke-width="1"/>
<line x1="130" y1="320.0" x2="730" y2="320.0" stroke="#e5e7eb" stroke-width="1"/>
<circle cx="238.0" cy="339.6" r="8" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="252.0" y="325.6" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">刚起步</text>
<circle cx="700.0" cy="339.6" r="8" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="714.0" y="325.6" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold">推进次数已超过绝大多数同类</text>
<circle cx="490.0" cy="138.0" r="8" fill="#c0392b" stroke="none" stroke-width="1.5"/>
<text x="476.0" y="124.0" font-size="13" fill="#1f2933" text-anchor="end" font-weight="bold">停了很久，波段还活着</text>
<text x="130" y="414" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text>
<text x="116" y="394" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">0</text>
<text x="430.0" y="414" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">0.5</text>
<text x="116" y="254.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">0.5</text>
<text x="730" y="414" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">1</text>
<text x="116" y="114" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">1</text>
<text x="430.0" y="438" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">推进分位：这条波段到目前推进的次数，在历史同类里排第几</text>
<text x="34" y="250.0" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold" transform="rotate(-90 34 250.0)">停滞分位：现在停的时间，在历史同类里排第几</text>
<text x="28" y="455" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">过渡区和未初始化不在这张图上：没有活波段，两个分位都是空。</text>
</svg>