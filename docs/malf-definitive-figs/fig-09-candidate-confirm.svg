<text x="28.0" y="406.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">第 22 根上破盘整高值 10.42，记新高第 1 只：它最高 10.52，低于前顶 10.66。按 v1.4 原文，要等第 27 根越过前顶才出生。</text>
<text x="28.0" y="424.0" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">新生小波段的守护点是盘整低点 10.20。以 k=2 为例，它在第 20 根收盘已经确认，早于上破那根。</text>
