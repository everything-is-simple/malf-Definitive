<text x="28.0" y="60.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">低点之后每根日线只有三种：创新低（接着跌）/ 最高价高过前一根（回升，不记）/ 都不是（停一根，盘整成立）。</text>
<text x="28.0" y="79.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">上破盘整高值那根 = 新高第 1 只。蓝底是盘整区，蓝虚线是盘整高值，红号是新高第几只。第几根从 1 数。手造示意数据。</text>
